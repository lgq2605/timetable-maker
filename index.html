<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Thời Khóa Biểu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
  :root{
    --paper:#faf7f0;
    --ink:#1f2933;
    --rule:#d8d2c2;
    --accent:#2f6f5e;
    --accent-soft:#e4efe9;
    --danger:#b3452c;
    --shadow:0 2px 10px rgba(31,41,51,.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 42px;
  }
  header{
    padding:28px 32px 18px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    border-bottom:2px solid var(--ink);
    background:var(--paper);
  }
  header h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-size:28px;
    margin:0;
    letter-spacing:.3px;
  }
  header .eyebrow{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--accent);
    font-weight:700;
    display:block;
    margin-bottom:4px;
  }
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    border-radius:6px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    padding:9px 16px;
    font-weight:600;
    transition:transform .08s ease, opacity .15s ease;
  }
  button.secondary{
    background:transparent;
    color:var(--ink);
  }
  button:hover{opacity:.85;}
  button:active{transform:scale(.97);}
  main{
    padding:24px 32px 60px;
  }
  #boardWrap{
    background:#fff;
    border:1.5px solid var(--ink);
    border-radius:10px;
    box-shadow:var(--shadow);
    overflow:auto;
    max-height:78vh;
    padding:18px;
  }
  #board{
    display:grid;
    grid-template-columns: 64px repeat(7, minmax(120px, 1fr));
    min-width:960px;
  }
  .head-cell{
    text-align:center;
    font-weight:700;
    font-size:14px;
    padding:8px 4px 14px;
    border-bottom:2px solid var(--ink);
    position:sticky;
    top:0;
    background:#fff;
    z-index:6;
  }
  .head-cell.time-head{
    visibility:visible;
    z-index:8;
  }
  .time-col{
    position:relative;
    background:#fff;
    z-index:5;
  }
  .time-label{
    position:absolute;
    right:8px;
    transform:translateY(-50%);
    font-size:11px;
    color:#7a7268;
  }
  .day-col{
    position:relative;
    border-left:1px solid var(--rule);
  }
  .hour-line{
    position:absolute;
    left:0;right:0;
    border-top:1px dashed var(--rule);
  }
  .event{
    position:absolute;
    left:4px;
    right:4px;
    border-radius:7px;
    padding:6px 8px;
    font-size:12px;
    line-height:1.3;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
    cursor:pointer;
    border:1px solid rgba(0,0,0,.12);
  }
  .event b{
    display:block;
    font-size:12.5px;
    margin-bottom:2px;
  }
  .event .time-range{
    font-size:10.5px;
    opacity:.8;
  }
  .event .del{
    position:absolute;
    top:2px;
    right:4px;
    font-size:12px;
    opacity:.55;
    display:none;
  }
  .event:hover .del{display:block;}

  /* Modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(31,41,51,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--paper);
    border:1.5px solid var(--ink);
    border-radius:10px;
    width:340px;
    max-width:92vw;
    padding:22px;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  .modal h2{
    margin:0 0 16px;
    font-size:18px;
    font-family:Georgia, serif;
  }
  .field{
    margin-bottom:13px;
  }
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:5px;
    color:#4a4640;
  }
  .field input[type=text], .field select, .field input[type=time]{
    width:100%;
    padding:8px 9px;
    border-radius:6px;
    border:1.3px solid var(--rule);
    font-size:14px;
    font-family:inherit;
    background:#fff;
  }
  .row2{
    display:flex;
    gap:10px;
  }
  .row2 > div{flex:1;}
  .color-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .color-row input[type=checkbox]{width:16px;height:16px;}
  .color-row input[type=color]{
    width:40px; height:32px; border:1.3px solid var(--rule); border-radius:6px; padding:2px; background:#fff;
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
  }
  .error-msg{
    color:var(--danger);
    font-size:12px;
    margin-top:-6px;
    margin-bottom:10px;
    display:none;
  }
  footer{
    text-align:center;
    font-size:11px;
    color:#9a927f;
    padding-bottom:30px;
  }
  .day-tabs{
    display:none;
    gap:6px;
    overflow-x:auto;
    padding:0 0 12px;
    -webkit-overflow-scrolling:touch;
  }
  .day-tabs button.tab{
    flex:0 0 auto;
    padding:8px 12px;
    font-size:12.5px;
    border-radius:999px;
    border:1.3px solid var(--rule);
    background:#fff;
    color:var(--ink);
    font-weight:600;
  }
  .day-tabs button.tab.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  @media(max-width:640px){
    header{
      padding:18px 16px 14px;
      flex-direction:column;
      align-items:stretch;
    }
    header h1{font-size:22px;}
    .toolbar{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .toolbar button{width:100%; padding:12px 10px; font-size:13.5px;}
    #addBtn{grid-column:1 / -1;}
    main{padding:12px;}
    #boardWrap{padding:10px;}
    .day-tabs{display:flex;}
    #board{
      grid-template-columns: 56px repeat(7, 82vw);
      min-width:0;
    }
    .day-col, .time-col{scroll-snap-align:start;}
    #boardWrap{
      overflow-x:auto;
      scroll-snap-type:x mandatory;
    }
    .head-cell{font-size:12.5px; padding:6px 2px 10px;}
    .event{font-size:12.5px; padding:7px 8px;}
    .event b{font-size:13px;}
    .event .del{display:block; opacity:.5; font-size:14px;}
    .modal{width:100%; max-width:96vw; padding:18px;}
    .field input[type=text], .field select, .field input[type=time]{font-size:16px; padding:10px;}
    .modal-actions button{padding:11px 16px;}
    button{min-height:40px;}
  }
</style>
</head>
<body>

<header>
  <div>
    <span class="eyebrow">Ho Chi Minh City · Lịch học</span>
    <h1>Thời Khóa Biểu</h1>
  </div>
  <div class="toolbar">
    <button id="addBtn">+ Thêm khung giờ</button>
    <button class="secondary" id="exportImgBtn">Tải ảnh (PNG)</button>
    <button class="secondary" id="exportXlsxBtn">Tải Excel (.xlsx)</button>
  </div>
</header>

<main>
  <div class="day-tabs" id="dayTabs"></div>
  <div id="boardWrap">
    <div id="board"></div>
  </div>
</main>

<footer>Nhấp vào một khung giờ để xóa · Dữ liệu chỉ lưu trong phiên làm việc này</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Thêm khung giờ</h2>
    <div class="field">
      <label>Tên môn học / hoạt động</label>
      <input type="text" id="labelInput" placeholder="VD: Toán, Tiếng Anh, CLB...">
    </div>
    <div class="field">
      <label>Thứ</label>
      <select id="dayInput">
        <option value="0">Thứ Hai</option>
        <option value="1">Thứ Ba</option>
        <option value="2">Thứ Tư</option>
        <option value="3">Thứ Năm</option>
        <option value="4">Thứ Sáu</option>
        <option value="5">Thứ Bảy</option>
        <option value="6">Chủ Nhật</option>
      </select>
    </div>
    <div class="row2">
      <div class="field">
        <label>Bắt đầu</label>
        <input type="time" id="startInput" value="07:00">
      </div>
      <div class="field">
        <label>Kết thúc</label>
        <input type="time" id="endInput" value="08:00">
      </div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="field">
      <label>Màu sắc</label>
      <div class="color-row">
        <input type="checkbox" id="autoColorChk" checked>
        <label for="autoColorChk" style="margin:0;font-weight:400;">Tự động chọn màu sáng</label>
        <input type="color" id="colorInput" value="#a8d8c9" disabled>
      </div>
    </div>
    <div class="modal-actions">
      <button class="secondary" id="cancelBtn">Hủy</button>
      <button id="saveBtn">Lưu</button>
    </div>
  </div>
</div>

<script>
// ---------- Config ----------
const DAYS = ["Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy","Chủ Nhật"];
const DAY_START = 6*60;   // 06:00 in minutes
const DAY_END   = 22*60;  // 22:00 in minutes
const PX_PER_MIN = 1.6;
const COLUMN_HEIGHT = (DAY_END - DAY_START) * PX_PER_MIN;

const PALETTE = [
  "#ffd8a8","#a8d8c9","#a8c9f0","#f0a8c9","#c9a8f0","#f0e0a8",
  "#a8f0d8","#f0b8a8","#b8f0a8","#a8e0f0","#f0a8e0","#d8a8f0",
  "#e0f0a8","#a8f0e8","#f0c9a8","#c9f0a8"
];

let events = []; // {id, day, start, end, label, color}
let idCounter = 1;

// ---------- Board rendering ----------
const board = document.getElementById('board');

function buildBoard(){
  board.innerHTML = "";
  // header row
  const timeHead = document.createElement('div');
  timeHead.className = 'head-cell time-head';
  timeHead.textContent = 'Giờ';
  board.appendChild(timeHead);

  DAYS.forEach(d=>{
    const h = document.createElement('div');
    h.className = 'head-cell';
    h.textContent = d;
    board.appendChild(h);
  });

  // time column
  const timeCol = document.createElement('div');
  timeCol.className = 'time-col';
  timeCol.style.height = COLUMN_HEIGHT + 'px';
  for(let m = DAY_START; m <= DAY_END; m += 60){
    const lbl = document.createElement('div');
    lbl.className = 'time-label';
    lbl.style.top = ((m-DAY_START)*PX_PER_MIN) + 'px';
    lbl.textContent = String(Math.floor(m/60)).padStart(2,'0') + ':00';
    timeCol.appendChild(lbl);
  }
  board.appendChild(timeCol);

  // day columns
  for(let d=0; d<7; d++){
    const col = document.createElement('div');
    col.className = 'day-col';
    col.style.height = COLUMN_HEIGHT + 'px';
    col.dataset.day = d;
    for(let m = DAY_START; m <= DAY_END; m += 60){
      const line = document.createElement('div');
      line.className = 'hour-line';
      line.style.top = ((m-DAY_START)*PX_PER_MIN) + 'px';
      col.appendChild(line);
    }
    board.appendChild(col);
  }

  renderEvents();
}

function renderEvents(){
  document.querySelectorAll('.event').forEach(e=>e.remove());
  events.forEach(ev=>{
    const col = board.querySelector(`.day-col[data-day="${ev.day}"]`);
    if(!col) return;
    const top = (ev.start - DAY_START) * PX_PER_MIN;
    const height = Math.max((ev.end - ev.start) * PX_PER_MIN, 20);
    const div = document.createElement('div');
    div.className = 'event';
    div.style.top = top + 'px';
    div.style.height = height + 'px';
    div.style.background = ev.color;
    div.innerHTML = `<span class="del">✕</span><b>${escapeHtml(ev.label)}</b><span class="time-range">${fmt(ev.start)}–${fmt(ev.end)}</span>`;
    div.title = "Nhấp để xóa";
    div.addEventListener('click', ()=>{
      if(confirm(`Xóa "${ev.label}" (${fmt(ev.start)}–${fmt(ev.end)})?`)){
        events = events.filter(e=>e.id !== ev.id);
        renderEvents();
      }
    });
    col.appendChild(div);
  });
}

function fmt(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toMinutes(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}

function pickAutoColor(){
  const used = new Set(events.map(e=>e.color.toLowerCase()));
  const free = PALETTE.find(c=>!used.has(c.toLowerCase()));
  if(free) return free;
  // all used up: pick a random bright HSL color
  const hue = Math.floor(Math.random()*360);
  return hslToHex(hue, 65, 80);
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}

// ---------- Modal ----------
const overlay = document.getElementById('overlay');
const addBtn = document.getElementById('addBtn');
const cancelBtn = document.getElementById('cancelBtn');
const saveBtn = document.getElementById('saveBtn');
const autoColorChk = document.getElementById('autoColorChk');
const colorInput = document.getElementById('colorInput');
const errorMsg = document.getElementById('errorMsg');

addBtn.addEventListener('click', ()=>{
  document.getElementById('labelInput').value = '';
  document.getElementById('dayInput').value = '0';
  document.getElementById('startInput').value = '07:00';
  document.getElementById('endInput').value = '08:00';
  autoColorChk.checked = true;
  colorInput.disabled = true;
  errorMsg.style.display = 'none';
  overlay.classList.add('open');
});
cancelBtn.addEventListener('click', ()=> overlay.classList.remove('open'));
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('open'); });
autoColorChk.addEventListener('change', ()=>{ colorInput.disabled = autoColorChk.checked; });

saveBtn.addEventListener('click', ()=>{
  const label = document.getElementById('labelInput').value.trim();
  const day = Number(document.getElementById('dayInput').value);
  const start = toMinutes(document.getElementById('startInput').value);
  const end = toMinutes(document.getElementById('endInput').value);

  if(!label){ showError('Vui lòng nhập tên môn học / hoạt động.'); return; }
  if(end <= start){ showError('Giờ kết thúc phải sau giờ bắt đầu.'); return; }
  if(start < DAY_START || end > DAY_END){ showError(`Vui lòng chọn khung giờ từ ${fmt(DAY_START)} đến ${fmt(DAY_END)}.`); return; }

  const color = autoColorChk.checked ? pickAutoColor() : colorInput.value;
  events.push({ id: idCounter++, day, start, end, label, color });
  overlay.classList.remove('open');
  renderEvents();
});

function showError(msg){
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
}

// ---------- Export: image ----------
document.getElementById('exportImgBtn').addEventListener('click', ()=>{
  const target = document.getElementById('boardWrap');
  html2canvas(target, {scale:2, backgroundColor:'#ffffff'}).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'thoi-khoa-bieu.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});

// ---------- Export: xlsx ----------
document.getElementById('exportXlsxBtn').addEventListener('click', ()=>{
  const slot = 30; // minutes per row
  const rows = Math.ceil((DAY_END - DAY_START)/slot);
  const data = [];
  const header = ['Giờ', ...DAYS];
  data.push(header);
  for(let r=0; r<rows; r++){
    const t = DAY_START + r*slot;
    data.push([fmt(t), '', '', '', '', '', '', '']);
  }

  const ws = XLSX.utils.aoa_to_sheet(data);
  const merges = [];

  // header style
  for(let c=0; c<8; c++){
    const addr = XLSX.utils.encode_cell({r:0, c});
    if(!ws[addr]) ws[addr] = {t:'s', v: header[c]};
    ws[addr].s = {
      font:{bold:true, color:{rgb:"1F2933"}},
      alignment:{horizontal:'center', vertical:'center'},
      border: borderAll(),
      fill:{fgColor:{rgb:"E4EFE9"}}
    };
  }
  // time column style
  for(let r=1; r<=rows; r++){
    const addr = XLSX.utils.encode_cell({r, c:0});
    ws[addr].s = { font:{sz:10, color:{rgb:"7A7268"}}, alignment:{horizontal:'center'}, border: borderAll() };
  }
  // blank cell borders
  for(let r=1; r<=rows; r++){
    for(let c=1; c<8; c++){
      const addr = XLSX.utils.encode_cell({r, c});
      if(!ws[addr]) ws[addr] = {t:'s', v:''};
      ws[addr].s = { border: borderAll() };
    }
  }

  events.forEach(ev=>{
    const startRow = 1 + Math.floor((ev.start - DAY_START)/slot);
    const endRow = 1 + Math.ceil((ev.end - DAY_START)/slot) - 1;
    const col = 1 + ev.day;
    const addr = XLSX.utils.encode_cell({r:startRow, c:col});
    const hex = ev.color.replace('#','').toUpperCase();
    ws[addr] = {
      t:'s',
      v: `${ev.label}\n${fmt(ev.start)}-${fmt(ev.end)}`,
      s: {
        fill:{fgColor:{rgb:hex}},
        font:{sz:10, bold:true, color:{rgb:"1F2933"}},
        alignment:{horizontal:'center', vertical:'center', wrapText:true},
        border: borderAll()
      }
    };
    if(endRow > startRow){
      merges.push({s:{r:startRow,c:col}, e:{r:endRow,c:col}});
    }
  });

  ws['!merges'] = merges;
  ws['!cols'] = [{wch:8}, ...DAYS.map(()=>({wch:16}))];
  ws['!rows'] = [{hpt:22}, ...Array(rows).fill({hpt: slot*PX_PER_MIN*0.75})];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Thời khóa biểu');
  XLSX.writeFile(wb, 'thoi-khoa-bieu.xlsx');
});

function borderAll(){
  const thin = {style:'thin', color:{rgb:"D8D2C2"}};
  return {top:thin, bottom:thin, left:thin, right:thin};
}

// ---------- Day tabs (mobile) ----------
const dayTabs = document.getElementById('dayTabs');
const boardWrap = document.getElementById('boardWrap');

function buildDayTabs(){
  dayTabs.innerHTML = '';
  DAYS.forEach((d,i)=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (i===0 ? ' active' : '');
    btn.textContent = d.replace('Thứ ','T').replace('Chủ Nhật','CN');
    btn.dataset.day = i;
    btn.addEventListener('click', ()=>{
      const col = board.querySelector(`.day-col[data-day="${i}"]`);
      if(col){
        boardWrap.scrollTo({ left: col.offsetLeft - 56, behavior:'smooth' });
      }
      dayTabs.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      btn.classList.add('active');
    });
    dayTabs.appendChild(btn);
  });
}

// keep tabs in sync when the user swipes the board manually
let scrollTimer;
function pinTimeAxis(){
  const shift = boardWrap.scrollLeft + 'px';
  document.querySelectorAll('.time-col, .head-cell.time-head').forEach(el=>{
    el.style.transform = `translateX(${shift})`;
  });
}
boardWrap.addEventListener('scroll', ()=>{
  pinTimeAxis();
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(()=>{
    const cols = board.querySelectorAll('.day-col');
    let closest = 0, minDist = Infinity;
    cols.forEach(col=>{
      const dist = Math.abs(col.offsetLeft - 56 - boardWrap.scrollLeft);
      if(dist < minDist){ minDist = dist; closest = Number(col.dataset.day); }
    });
    dayTabs.querySelectorAll('.tab').forEach(t=>{
      t.classList.toggle('active', Number(t.dataset.day) === closest);
    });
  }, 100);
});

// ---------- Init ----------
buildDayTabs();
buildBoard();
pinTimeAxis();
</script>

</body>
</html>
